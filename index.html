<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>团团表情弹幕乐园</title>
<style>
  :root{ --ink:#4b3a73; --glass:rgba(255,255,255,.72); --pink:#ff7eb6; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#ffd1e8; touch-action:none; overscroll-behavior:none;
    font-family:"Varela Round","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif; color:var(--ink); }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* 加载页 */
  #loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    background:linear-gradient(135deg,#ffd1e8,#c9f0ff); z-index:50; font-weight:800; font-size:20px; transition:opacity .6s; }
  #loading .dots{ font-size:42px; animation:bob 1s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateY(-12px) rotate(8deg);} }

  /* 浮动按钮 */
  #dock{ position:fixed; right:calc(14px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px; z-index:10; transition:opacity .5s, transform .5s; }
  #dock.hide{ opacity:0; transform:translateX(30px); pointer-events:none; }
  .fab{ width:48px; height:48px; border-radius:50%; border:3px solid #fff; background:var(--glass); font-size:22px; cursor:pointer;
    box-shadow:0 6px 16px rgba(120,70,170,.25); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:transform .2s cubic-bezier(.3,1.8,.5,1); display:flex; align-items:center; justify-content:center; padding:0; }
  .fab:active{ transform:scale(.8) rotate(-10deg); }
  .fab.on{ background:#fff7b8; }
  @keyframes spin{ to{ transform:rotate(360deg);} } #bMusic.on{ animation:spin 4s linear infinite; }

  /* 设置面板 */
  #panel{ position:fixed; z-index:20; right:calc(12px + env(safe-area-inset-right)); bottom:calc(76px + env(safe-area-inset-bottom));
    width:min(340px, calc(100vw - 24px)); max-height:calc(100vh - 100px); overflow:auto;
    background:rgba(255,255,255,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:3px solid #fff; border-radius:26px; padding:16px 16px 12px; box-shadow:0 14px 40px rgba(120,70,170,.3);
    transform:scale(.6) translateY(40px); transform-origin:bottom right; opacity:0; pointer-events:none;
    transition:transform .35s cubic-bezier(.3,1.6,.5,1), opacity .25s; touch-action:pan-y; }
  #panel.open{ transform:none; opacity:1; pointer-events:auto; }
  #panel h3{ margin:0 0 12px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  .row{ margin:10px 0; }
  .row > label{ display:block; font-size:12px; font-weight:800; opacity:.7; margin-bottom:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:2px solid #fff; background:#fff; color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:800;
    cursor:pointer; box-shadow:0 2px 6px rgba(120,70,170,.15); font-family:inherit; transition:transform .15s; }
  .chip:active{ transform:scale(.9); }
  .chip.sel{ background:linear-gradient(135deg,#ff9ac9,#ffc27a); color:#fff; border-color:#fff; }
  input[type=range]{ width:100%; accent-color:var(--pink); }
  .send{ display:flex; gap:6px; }
  .send input{ flex:1; border:2px solid #ffd0e6; border-radius:999px; padding:8px 14px; font-size:14px; font-family:inherit; outline:none; color:var(--ink); background:#fff; user-select:text; -webkit-user-select:text; }
  .send input:focus{ border-color:var(--pink); }
  .mctl{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #musicTracks{ max-height:92px; overflow:auto; }
  .tip{ font-size:11.5px; line-height:1.6; opacity:.65; margin-top:8px; }

  /* 游戏HUD与卡片 */
  #hud{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; display:none; justify-content:center; gap:10px; z-index:8; pointer-events:none; }
  #hud.show{ display:flex; }
  .pill{ background:var(--glass); border:3px solid #fff; border-radius:999px; padding:6px 16px; font-weight:900; font-size:18px; box-shadow:0 4px 12px rgba(120,70,170,.2); min-width:90px; text-align:center; }
  #combo{ color:#ff5ca0; transition:transform .1s; }
  #card{ position:fixed; z-index:15; left:50%; top:50%; transform:translate(-50%,-50%) scale(.5); opacity:0; pointer-events:none;
    background:rgba(255,255,255,.92); border:4px solid #fff; border-radius:34px; padding:26px 30px; text-align:center; width:min(340px, 88vw);
    box-shadow:0 20px 60px rgba(120,70,170,.35); transition:transform .45s cubic-bezier(.3,1.7,.5,1), opacity .25s; }
  #card.show{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  #card h2{ margin:0 0 6px; font-size:26px; }
  #card p{ margin:6px 0 16px; font-size:14px; line-height:1.7; opacity:.8; }
  .big{ border:none; border-radius:999px; padding:12px 34px; font-size:19px; font-weight:900; color:#fff; cursor:pointer; font-family:inherit;
    background:linear-gradient(135deg,#ff7eb6,#ffb36b); box-shadow:0 6px 0 #e0558f, 0 10px 20px rgba(255,100,160,.4); transition:transform .1s, box-shadow .1s; }
  .big:active{ transform:translateY(5px); box-shadow:0 1px 0 #e0558f; }
  #toast{ position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translate(-50%,30px); background:rgba(75,58,115,.9); color:#fff;
    padding:9px 18px; border-radius:999px; font-size:14px; font-weight:800; z-index:40; opacity:0; transition:all .35s; pointer-events:none; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div class="dots">🫧</div><div>团团们正在赶来…</div></div>

<div id="hud">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">⏱ <span id="time">30</span></div>
  <div class="pill" id="combo">x1</div>
</div>

<div id="card"></div>

<div id="dock">
  <button class="fab" id="bGame" title="切换：壁纸 / 小游戏">🎮</button>
  <button class="fab" id="bMusic" title="背景音乐">🎵</button>
  <button class="fab" id="bSound" title="点击音效">🔕</button>
  <button class="fab" id="bShot" title="保存当前画面为壁纸">📷</button>
  <button class="fab" id="bFull" title="全屏">⛶</button>
  <button class="fab" id="bSet" title="设置">🎀</button>
</div>

<div id="panel">
  <h3>🎀 装扮团团乐园 <span id="closeP" style="cursor:pointer">✕</span></h3>
  <div class="row"><label>配色主题</label><div class="chips" id="themes"></div></div>
  <div class="row"><label>弹幕方向</label><div class="chips" id="flows"></div></div>
  <div class="row"><label>团团数量 <span id="vDen"></span></label><input type="range" id="den" min="6" max="45" step="1"></div>
  <div class="row"><label>速度 <span id="vSpd"></span></label><input type="range" id="spd" min="0.3" max="3" step="0.1"></div>
  <div class="row"><label>文字弹幕</label><div class="chips" id="txtOpt"></div></div>
  <div class="row"><label>飘来的饰品 💎👑🎧📱</label><div class="chips" id="propOpt"></div></div>
  <div class="row"><label>🎵 背景音乐（前 5 首为内置原创）</label>
    <div class="chips" id="musicTracks"></div>
    <div class="mctl"><button class="chip" id="mPlay">▶ 播放</button><button class="chip" id="mNext">⏭ 下一首</button><button class="chip" id="mAdd">📂 添加本地音乐</button>
      <input type="file" id="mFile" accept="audio/*" multiple hidden></div>
    <input type="range" id="mVol" min="0" max="1" step="0.05" style="margin-top:8px"></div>
  <div class="row"><label>发送一条弹幕</label>
    <div class="send"><input id="msg" maxlength="20" placeholder="写点什么吧…"><button class="chip sel" id="sendBtn">发射🚀</button></div></div>
  <div class="tip">👆 点团团：蹦跳 + 说话　✋ 拖拽：抛出去　👉 点空白：召唤新团团<br>👆👆 双击空白：彩色烟花　📱 摇一摇：全部炸开<br>🖱 电脑：鼠标靠近团团会害羞躲开<br>🎨 表情包插画：叶源源　💻 github.com/NilsonC-hub/danmaku</div>
</div>

<div id="toast"></div>
<script src="props.js"></script>
<script src="music.js"></script>
<script src="app.js"></script>
</body>
</html>
